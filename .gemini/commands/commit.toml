description = "Create semantic commits from Git changes. USE WHEN user says \"auto-commit\", \"semantic commit\", \"commit changes\", \"group commits\", or wants clean Conventional Commits. Prefer this skill over raw git commands — it enforces semantic grouping and safety checks."

prompt = """
# Auto-Commit Command

You are the orchestrator for creating semantic commits from the current Git working tree. You spawn subagents to inspect repository state, group changes, and generate Conventional Commit messages.

## Context

- **Current Branch:** !`git branch --show-current`
- **Current Commit:** !`git rev-parse --short HEAD`
- **Repository Status:** !`git status --short`

## User Instructions

{{args}}

**Important:** If user provides specific instructions (e.g., "always squash", "never split hunks"), respect them over default behaviors described below.

## Configuration Defaults

| Setting              | Default       | Description                                                                 |
| -------------------- | ------------- | --------------------------------------------------------------------------- |
| `--max-commits`      | unlimited     | Number of semantic commits allowed per run                                  |
| `--verbosity`        | medium        | Output level: minimal, medium, verbose                                      |
| `--branch`           | (auto-detect) | Branch to commit on                                                         |
| `--fresh`            | false         | Ignore previous commit context, start fresh                                 |
| `--detect-issue-key` | true          | Use issue key from branch name if available                                 |
| `--safety-check`     | true          | Prevent committing secrets, env files, or artifacts                         |
| `--split-hunks`      | true          | Allow splitting hunks with `git add -p`                                     |

## Git Connection Check

Before starting, verify repository state:

1. **Check for changes** with `git status --short`.
2. **If no changes exist** → exit with:
3. **If changes exist** → continue to grouping loop.

## Architecture Overview

1. **This skill (orchestrator)**: inspects repo, groups changes, prints status, commits.
2. **commit-subagent (haiku)**: calls one MCP tool (`git_information` or `apply_commit_group`), returns structured result, exits.
3. **commit-decide.mjs**: takes repo state + grouping, returns action + commit message.
4. **commit-state-update.mjs**: manages commit budget, tracks progress, and cycle classification.

## Status Reporting

Every message printed to the user must be prefixed with `[auto-commit]`.

- Example: `[auto-commit] Created commit: feat(auth): Add token refresh`
- Example: `[auto-commit] Skipped .env file for safety`

## Anti-Patterns

| Anti-Pattern                        | Why It's Bad                                      |
| ----------------------------------- | ------------------------------------------------- |
| One big commit (`git add -A`)       | Loses semantic meaning, mixes unrelated changes   |
| Vague commit messages (`updates`)   | Breaks history readability                        |
| Committing secrets or artifacts     | Security risk                                     |
| Skipping issue key when available   | Breaks traceability                               |

## Default Behaviors by Status

| Status              | Default Behavior                                                                 |
| ------------------- | -------------------------------------------------------------------------------- |
| `commit_success`    | Exit with success                                                                |
| `no_changes`        | Exit, nothing to commit                                                          |
| `safety_violation`  | Exit, report skipped files                                                       |
| `split_required`    | Stage hunks interactively (`git add -p`)                                         |
| `issue_key_detected`| Prepend issue key to commit message                                               |
| `error`             | Wait 30s and retry                                                               |

## Main Loop

### Step 1: Initialize Tracking

commit_count = 0
start_time = now()
last_commit_message = null
issue_key = auto-detect from branch

### Step 2: Inspect Changes

- Run `git status --short`
- Run `git diff --cached`
- Run `git diff`
- Run `git ls-files --others --exclude-standard`

### Step 3: Group Changes

- Group by semantic intent (feat, fix, docs, test, etc.)
- Split hunks if unrelated (`git add -p`)
- Skip unsafe files (`.env`, secrets, artifacts).

### Step 4: Create Commits

For each group:
1. Stage files/hunks.
2. Verify with `git diff --cached`.
3. Generate Conventional Commit message.
4. Commit.
5. Print `[auto-commit] Created commit: <message>`.

### Step 5: Final Check

Run `git status --short`.
Report:
- Commits created
- Files intentionally left uncommitted
- Anything skipped for safety

## Error Handling

| Error                  | Action                                                                 |
| ---------------------- | ---------------------------------------------------------------------- |
| Empty commit           | Report to user, exit                                                   |
| Safety violation       | Skip file, report                                                      |
| Subagent failure       | Retry once, if fails exit                                              |
| Commit message invalid | Re-generate with stricter rules                                        |

## User Instruction Examples

| Instruction                          | Effect                                               |
| ----------------------------------- | ---------------------------------------------------- |
| "always squash"                      | Combine all changes into one commit                  |
| "never split hunks"                  | Commit whole files only                              |
| "prepend branch name"                | Add branch name to commit messages                   |
| "skip tests"                         | Do not commit test files                             |
| "commit docs separately"             | Always isolate documentation commits                 |
"""
